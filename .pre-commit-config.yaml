# Pre-commit hooks configuration
# Automatically runs code quality checks before each commit
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python linting and formatting with Ruff (replaces black, flake8, isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        name: Lint Python code with Ruff
        args: [--fix]  # Auto-fix issues without blocking commit
      - id: ruff-format
        name: Format Python code with Ruff

  # Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        name: Type check with mypy
        additional_dependencies: [pydantic>=2.0.0, types-PyYAML>=6.0.0]
        args: [--ignore-missing-imports, --show-error-codes]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
      - id: end-of-file-fixer
        name: Ensure files end with newline
      - id: check-yaml
        name: Validate YAML files
      - id: check-json
        name: Validate JSON files
      - id: check-added-large-files
        name: Prevent large files (>500KB)
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: debug-statements
        name: Check for debugger imports

  # Security scanning (high-severity only for speed)
  # Comprehensive scan runs in CI/CD
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        name: Security scan with Bandit (high severity)
        args: [--severity-level, high, -c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  # Dependency security
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.4.2
    hooks:
      - id: python-safety-dependencies-check
        name: Check dependencies for vulnerabilities
        files: requirements.*\.txt$

  # Commit message validation (conventional commits)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        name: Validate commit message format
        stages: [commit-msg]
        args: [--strict]

# Configuration options

  # Structural lint: AST shapes ruff and grep cannot express, e.g. "a return of
  # an empty collection anywhere inside an except handler" (needs the `inside`
  # relational operator). Rules live in .ast-grep/rules/.
  # Whole-tree scan, not new-code-only: the tree is at zero violations, so
  # there is no backlog to grandfather.
  - repo: local
    hooks:
      - id: ast-grep
        name: Structural lint (ast-grep)
        entry: ast-grep scan
        language: python
        additional_dependencies: [ast-grep-cli>=0.40.0]
        types: [python]
        pass_filenames: false

  # Secret scanning — block commits containing API keys, tokens, private keys.
  # Added by add-gitleaks-hook.sh after the 2026-05-10 secret-sprawl audit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        name: Scan for committed secrets (gitleaks)

default_language_version:
  python: python3.12

# Skip hooks for specific commits
# Usage: SKIP=mypy git commit -m "..."
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
