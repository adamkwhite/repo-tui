name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', 'LICENSE', '.gitignore', '.github/**']
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
    paths-ignore: ['*.md', 'docs/**', 'LICENSE', '.gitignore', '.github/**']
  workflow_dispatch:  # Allow manual triggers

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-commit Checks (Ruff, mypy, formatting)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test with pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history: the new-code coverage gate below diffs against the
          # PR base commit, which a shallow clone does not contain.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project dependencies
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Install dev dependencies
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          # Install package in editable mode if pyproject.toml exists
          if [ -f pyproject.toml ]; then
            pip install -e .
          fi

      - name: Run tests with coverage
        run: |
          # Check if tests exist
          if find tests/ -name "test_*.py" -type f | grep -q .; then
            pytest tests/ \
              --cov=src \
              --cov-report=term-missing \
              --cov-report=xml \
              --cov-report=html \
              --html=test-report.html \
              --self-contained-html \
              -v
          else
            echo "No test files found, skipping pytest"
            echo "This is expected for a template repository"
          fi

      # SonarCloud's free plan cannot assign a custom quality gate, so the
      # "new code must hit 80%" rule is enforced here instead. diff-cover
      # scores ONLY the lines this PR adds or changes, which is why the
      # threshold can be 80% while the project sits at 56% overall — existing
      # untouched code is exempt, same model as Sonar's new-code period.
      - name: New-code coverage gate
        if: github.event_name == 'pull_request' && hashFiles('coverage.xml') != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          # Report even on failure: the whole point is seeing WHICH lines are
          # uncovered, and a bare non-zero exit does not say.
          set +e
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80 \
            --markdown-report=diff-cover.md
          status=$?
          set -e
          [ -f diff-cover.md ] && cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Hand coverage.xml to the downstream `sonarcloud` job so it does not
      # re-run the entire pytest suite (saves ~6 min/PR).
      - name: Upload coverage.xml for SonarCloud
        if: hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

      - name: Upload coverage to artifacts
        if: hashFiles('htmlcov/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Upload test report to artifacts
        if: hashFiles('test-report.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-report.html
          retention-days: 30

      - name: Coverage summary
        if: hashFiles('.coverage') != ''
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Consumes coverage.xml from the `test` job above instead of re-running
  # pytest. Skipped on draft PRs and Dependabot (no SONAR_TOKEN access).
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    if: github.actor != 'dependabot[bot]' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    permissions:
      contents: read

    # Job level, not step level. The `if: env.SONAR_TOKEN != ''` guards below
    # are evaluated against the workflow/job env context — a step's own `env:`
    # block is not visible to that step's own `if:`. With the token defined
    # only on the steps, the guards read an empty string, both steps skipped
    # every run, and the job still reported success because a job whose steps
    # all skipped is a passing job.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage.xml from test job
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml
          path: .
        continue-on-error: true

      # Without this, "SonarCloud Analysis: success" on a run where nothing was
      # analyzed is indistinguishable from a real passing quality gate.
      - name: Warn when Sonar is not configured
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::warning title=SonarCloud skipped::SONAR_TOKEN is not set, so no analysis ran and no quality gate was evaluated. This job's green check does NOT mean the gate passed."

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.13

      - name: SonarCloud Quality Gate check
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        continue-on-error: true
